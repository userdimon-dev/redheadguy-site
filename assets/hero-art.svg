<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480">
  <!-- Большой сфера / планета (интернет без границ) -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6b1a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff6b1a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Свечение -->
  <circle cx="240" cy="240" r="230" fill="url(#glow)"/>

  <!-- Планета -->
  <circle cx="240" cy="240" r="140" fill="#1a1f29" stroke="#262d3a" stroke-width="2"/>

  <!-- Горизонтальные линии (глобус) -->
  <ellipse cx="240" cy="240" rx="140" ry="45" fill="none" stroke="#262d3a" stroke-width="2"/>
  <ellipse cx="240" cy="240" rx="140" ry="28" fill="none" stroke="#262d3a" stroke-width="1.5"/>

  <!-- Главная точка доступа -->
  <circle cx="240" cy="240" r="16" fill="#ff6b1a"/>
  <circle cx="240" cy="240" r="26" fill="none" stroke="#ff6b1a" stroke-width="3" opacity="0.6"/>
  <circle cx="240" cy="240" r="40" fill="none" stroke="#ff6b1a" stroke-width="2" opacity="0.3"/>

  <!-- Сеть узлов -->
  <g fill="#ff6b1a">
    <circle cx="120" cy="180" r="7"/>
    <circle cx="360" cy="170" r="6"/>
    <circle cx="150" cy="320" r="6"/>
    <circle cx="330" cy="310" r="7"/>
    <circle cx="240" cy="90" r="6"/>
    <circle cx="90" cy="240" r="5"/>
    <circle cx="390" cy="240" r="5"/>
  </g>

  <!-- Линии соединений -->
  <g stroke="#ff6b1a" stroke-width="1.5" opacity="0.5" fill="none">
    <line x1="240" y1="240" x2="120" y2="180"/>
    <line x1="240" y1="240" x2="360" y2="170"/>
    <line x1="240" y1="240" x2="150" y2="320"/>
    <line x1="240" y1="240" x2="330" y2="310"/>
    <line x1="240" y1="240" x2="240" y2="90"/>
    <line x1="240" y1="240" x2="90" y2="240"/>
    <line x1="240" y1="240" x2="390" y2="240"/>
  </g>

  <!-- Внешние кольца орбит -->
  <circle cx="240" cy="240" r="190" fill="none" stroke="#262d3a" stroke-width="1.5" stroke-dasharray="6 10" opacity="0.7"/>
  <circle cx="240" cy="240" r="210" fill="none" stroke="#262d3a" stroke-width="1" stroke-dasharray="3 8" opacity="0.5"/>
</svg>
